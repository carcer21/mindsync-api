spring:
  application:
    name: mindsync
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 30m
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.5-flash-lite
    base-url: https://generativelanguage.googleapis.com
    connect-timeout: 3s
    read-timeout: 15s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
