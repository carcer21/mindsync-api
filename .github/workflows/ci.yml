name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit SHA (the tag is shown in the comment): a tag can be moved.
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The wrapper is stored in Git without the execute bit (it was committed from Windows).
      - name: Make the Maven wrapper executable
        run: chmod +x ./mvnw

      # No secrets needed: tests use their own PostgreSQL (Testcontainers, Docker is preinstalled
      # on the runner), a random JWT secret and no Gemini key.
      # verify also runs JaCoCo: the build fails if domain/application coverage drops below 90%.
      - name: Build and run all tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # Kept even when the build fails, so the report can explain why.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-report
          path: target/site/jacoco
          retention-days: 14
          if-no-files-found: ignore
