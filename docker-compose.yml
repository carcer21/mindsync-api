services:
  postgres:
    image: postgres:18-alpine
    container_name: mindsync-postgres
    environment:
      POSTGRES_DB: mindsync
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d mindsync"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
